<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:locale" content="%LOCALE%" />
    <meta property="profile:first_name" content="Nawaz" />
    <meta property="profile:last_name" content="Shariff" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <script type="application/ld+json">%JSON_LD%</script>
  </head>
  <body>
    <noscript>
      <div style="padding:2rem;font-family:Georgia,serif;color:#F3EBDD;background:#07090D;min-height:100vh">
        <h1>Nawaz Shariff</h1>
        <p>Accountant &amp; Sales Head — Exar International, Kingdom of Saudi Arabia.</p>
        <p>This portfolio is best experienced with JavaScript enabled.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
